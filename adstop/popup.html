<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { font: 14px -apple-system, "Segoe UI", Roboto, sans-serif; width: 320px; margin: 0; color: #1c2233; background: #f3f5f9; }
  header { background: linear-gradient(135deg, #0b1f4b, #16357a); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  header svg { width: 26px; height: 26px; }
  header b { font-size: 17px; letter-spacing: .2px; }
  header .tag { margin-left: auto; font-size: 11px; background: rgba(255,255,255,.15); padding: 3px 8px; border-radius: 10px; }

  .hero { background: #fff; margin: 12px; border-radius: 12px; padding: 18px 16px; text-align: center; box-shadow: 0 1px 3px rgba(16,30,70,.08); }
  .shield { width: 74px; height: 74px; border-radius: 50%; margin: 0 auto 10px; display: grid; place-items: center; background: #e6f6ee; transition: background .2s; }
  .shield svg { width: 40px; height: 40px; fill: #18a058; transition: fill .2s; }
  .off .shield { background: #fdecec; }
  .off .shield svg { fill: #d93838; }
  .status { font-size: 16px; font-weight: 600; }
  .site { color: #6b7385; font-size: 12px; margin-top: 3px; word-break: break-all; }

  .btn { display: block; width: calc(100% - 24px); margin: 0 12px 10px; padding: 11px; border: 0; border-radius: 10px; font: 600 14px inherit; font-family: inherit; cursor: pointer; background: #1f5eff; color: #fff; }
  .btn:hover { background: #164ad1; }
  .btn.ghost { background: #fff; color: #1f5eff; border: 1px solid #c9d6ff; }
  .btn.ghost:hover { background: #eef3ff; }
  .btn:disabled { opacity: .5; cursor: default; }

  .stats { display: flex; margin: 0 12px 12px; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(16,30,70,.08); }
  .stats div { flex: 1; padding: 12px; text-align: center; }
  .stats div + div { border-left: 1px solid #edf0f5; }
  .stats strong { display: block; font-size: 20px; color: #0b1f4b; }
  .stats span { font-size: 11px; color: #6b7385; text-transform: uppercase; letter-spacing: .4px; }

  .row { display: flex; justify-content: space-between; align-items: center; margin: 0 12px 12px; padding: 12px; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(16,30,70,.08); }
  .switch { position: relative; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch i { position: absolute; inset: 0; background: #c5cbd8; border-radius: 22px; cursor: pointer; transition: .2s; }
  .switch i::before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + i { background: #18a058; }
  .switch input:checked + i::before { transform: translateX(18px); }
</style>
</head>
<body>
  <header>
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z"/></svg>
    <b>AdStop</b><span class="tag">Gratuit</span>
  </header>

  <section class="hero" id="hero">
    <div class="shield"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4-6.3 6.3z"/></svg></div>
    <div class="status" id="status">Protégé</div>
    <div class="site" id="site"></div>
  </section>

  <button class="btn" id="pause">Ne pas bloquer sur ce site</button>

  <div class="stats">
    <div><strong id="blocked">0</strong><span>Bloqués au total</span></div>
    <div><strong id="nsites">0</strong><span>Sites autorisés</span></div>
  </div>

  <label class="row">Protection activée
    <span class="switch"><input type="checkbox" id="enabled"><i></i></span>
  </label>

  <script src="popup.js"></script>
</body>
</html>
